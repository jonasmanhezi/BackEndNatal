server:
  port: ${PORT:8080}
  # Render/Railway ficam atrás de proxy: usa o X-Forwarded-For para saber o IP real (limite de tentativas)
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
    disable-swagger-default-url: true

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.github.io,https://*.vercel.app,https://*.netlify.app,https://*.pages.dev,https://*.onrender.com}
  # Chave do organizador. Vazia = rotas /api/admin/* ficam fechadas.
  admin-key: ${ADMIN_KEY:}
  rate-limit:
    cadastros-por-hora: ${RATE_LIMIT_CADASTROS_POR_HORA:30}
    falhas-admin-por-15min: ${RATE_LIMIT_FALHAS_ADMIN:10}
