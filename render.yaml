services:
  - type: web
    name: amigo-secreto-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: http://localhost:5173,https://*.github.io,https://*.vercel.app
